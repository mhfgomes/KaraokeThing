name: Publish Docker Image

on:
  workflow_call:
    inputs:
      nightly:
        description: Publish only the nightly tag instead of release tags.
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_IMAGE:?Set the DOCKERHUB_IMAGE repository variable (namespace/repository)}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          flavor: latest=${{ inputs.nightly && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}},enable=${{ !inputs.nightly }}
            type=semver,pattern={{raw}},enable=${{ !inputs.nightly }}
            type=raw,value=nightly,enable=${{ inputs.nightly }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each architecture runs natively. Only the final job updates public tags.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ vars.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=karaokething-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=karaokething-${{ matrix.arch }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish to Docker Hub
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digests-*
          merge-multiple: true

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          flavor: latest=${{ inputs.nightly && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}},enable=${{ !inputs.nightly }}
            type=semver,pattern={{raw}},enable=${{ !inputs.nightly }}
            type=raw,value=nightly,enable=${{ inputs.nightly }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$META_JSON")
          test "${#tag_args[@]}" -gt 0
          digests=(*)
          test "${#digests[@]}" -eq 2
          image_refs=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            image_refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_refs[@]}"
