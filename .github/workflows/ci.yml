name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          package-manager-cache: false

      - uses: pnpm/setup@v3
        with:
          version: 12.10.1
          cache: true
          install: false

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker compose build

      - name: Install pinned audio model in test volume
        run: docker compose run --rm --no-deps karaoke node scripts/install-model.mjs

      - name: Start server and worker
        run: docker compose up -d --wait --wait-timeout 90

      - name: Test shipped image and supported audio formats
        run: |
          docker compose cp tests/docker-smoke.mjs karaoke:/tmp/docker-smoke.mjs
          docker compose exec -T -e KARAOKE_DOCKER_SMOKE=1 karaoke node /tmp/docker-smoke.mjs

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs karaoke

      - name: Remove test containers and volume
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish to Docker Hub
    needs: [checks, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_IMAGE:?Set the DOCKERHUB_IMAGE repository variable (namespace/repository)}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=karaokething-release
          cache-to: type=gha,mode=max,scope=karaokething-release
